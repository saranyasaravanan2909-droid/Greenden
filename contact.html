<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenDen - Contact</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->

    <nav class="bg-green-100 p-4 flex items-center justify-between shadow-md">

        <h1 class="text-2xl font-bold text-green-900">
            GreenDen
        </h1>

        <ul class="flex gap-6 text-green-900 font-medium">
            <li><a href="index.html" class="hover:underline">Home</a></li>
            <li><a href="products.html" class="hover:underline">Products</a></li>
            <li><a href="contact.html" class="hover:underline">Contact</a></li>
        </ul>

    </nav>


    <!-- Contact Section -->

    <section class="p-10">

        <h1 class="text-4xl font-bold text-center text-green-900 mb-4">
            Contact Us
        </h1>

        <p class="text-gray-600 text-center mb-10">
            Have any questions? We would love to hear from you.
        </p>


        <div class="max-w-xl mx-auto bg-green-50 p-8 rounded-lg shadow-md">

            <form>

                <label class="block font-medium mb-2">
                    Your Name
                </label>

                <input
                    type="text"
                    placeholder="Enter your name"
                    class="border p-3 w-full mb-5 rounded"
                    required>


                <label class="block font-medium mb-2">
                    Your Email
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    class="border p-3 w-full mb-5 rounded"
                    required>


                <label class="block font-medium mb-2">
                    Subject
                </label>

                <input
                    type="text"
                    placeholder="Enter subject"
                    class="border p-3 w-full mb-5 rounded">


                <label class="block font-medium mb-2">
                    Message
                </label>

                <textarea
                    placeholder="Write your message"
                    rows="5"
                    class="border p-3 w-full mb-5 rounded"
                    required></textarea>


                <button
                    type="submit"
                    class="bg-green-900 text-white px-6 py-3 rounded w-full">

                    Send Message

                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->

    <footer class="bg-green-900 text-white p-10">

        <h2 class="text-3xl font-bold mb-4">
            GreenDen
        </h2>

        <p class="mb-4">
            Bring nature closer to your home with GreenDen.
        </p>

        <p>© 2026 GreenDen. All Rights Reserved.</p>

    </footer>

</body>
</html>
